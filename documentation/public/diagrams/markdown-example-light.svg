<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" role="img" aria-labelledby="markdown-example-light-title markdown-example-light-desc">
  <title id="markdown-example-light-title">Example image (light theme)</title>
  <desc id="markdown-example-light-desc">Two boxes, Fetch and Work log, joined by an arrow, drawn for the light theme.</desc>
  <rect width="480" height="120" fill="#f8fafc"/>
  <rect x="40" y="35" width="140" height="50" rx="8" fill="none" stroke="#1e3a8a" stroke-width="2"/>
  <text x="110" y="66" font-family="sans-serif" font-size="18" fill="#0f172a" text-anchor="middle">Fetch</text>
  <line x1="180" y1="60" x2="290" y2="60" stroke="#1e3a8a" stroke-width="2"/>
  <polygon points="290,54 302,60 290,66" fill="#1e3a8a"/>
  <rect x="302" y="35" width="140" height="50" rx="8" fill="none" stroke="#1e3a8a" stroke-width="2"/>
  <text x="372" y="66" font-family="sans-serif" font-size="18" fill="#0f172a" text-anchor="middle">Work log</text>
</svg>
