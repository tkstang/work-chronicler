name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

# Only replacement verification for the same ready PR cancels an earlier run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event_name == 'pull_request' &&
    !github.event.pull_request.draft &&
    format('pr-{0}', github.event.pull_request.number) ||
    format('run-{0}', github.run_id) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
    !github.event.pull_request.draft }}

jobs:
  ci:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # pnpm 12 support needs pnpm/action-setup v6.1.0 or later. The version
      # comes from package.json `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: >-
            ${{ github.event_name == 'pull_request' &&
            'https://registry.npmjs.org' ||
            '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish dry run
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        run: pnpm publish --dry-run --no-git-checks
