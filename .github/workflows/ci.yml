name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

# Only replacement verification for the same ready PR cancels an earlier run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event_name == 'pull_request' &&
    !github.event.pull_request.draft &&
    format('pr-{0}', github.event.pull_request.number) ||
    format('run-{0}', github.run_id) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
    !github.event.pull_request.draft }}

jobs:
  ci:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Full history: the docs check compares diagrams against origin/main.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      # pnpm 12 support needs pnpm/action-setup v6.1.0 or later. The version
      # comes from package.json `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: >-
            ${{ github.event_name == 'pull_request' &&
            'https://registry.npmjs.org' ||
            '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The docs app (documentation/) installs with the root workspace; its
      # devDependencies provide the oat CLI.
      - name: Add docs tools to PATH
        run: echo "$GITHUB_WORKSPACE/documentation/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify documentation
        env:
          DOCS_ROOT: documentation
          DOCS_CONTENT: documentation/docs
          DOCS_TOOLING: fumadocs
          DOCS_BUILD_SCRIPT: build
          DOCS_MANIFEST: documentation/index.md
        shell: bash
        run: |
          set -euo pipefail
          oat docs check --target-dir "$DOCS_ROOT"
          oat docs nav sync --target-dir "$DOCS_ROOT" --check
          if [ "$DOCS_TOOLING" != markdown ]; then
            (cd "$DOCS_ROOT" && pnpm run "$DOCS_BUILD_SCRIPT")
          fi
          if [ -n "$DOCS_MANIFEST" ]; then
            git ls-files --error-unmatch -- "$DOCS_MANIFEST"
            oat docs generate-index --docs-dir "$DOCS_CONTENT" --output "$DOCS_MANIFEST"
            git diff --exit-code -- "$DOCS_MANIFEST"
          fi

      - name: Publish dry run
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        run: pnpm publish --dry-run --no-git-checks
