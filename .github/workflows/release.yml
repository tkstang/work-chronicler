name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Releases queue behind each other and are never cancelled mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GIT_HOOKS: '0'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # npm trusted publishing (GitHub OIDC); no stored npm token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm CLI 11.5.1 or later.
      - name: Ensure npm supports trusted publishing
        run: |
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            npm install --global npm@11
          fi
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A failure in any check stops the npm publish and the GitHub Release.
      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish
        run: npm publish --access public --provenance

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📦 Installation

            ```bash
            # Install globally
            npm install -g work-chronicler

            # Or use npx
            npx work-chronicler init
            ```

            ## 📋 Full Changelog
            See below for auto-generated release notes.
